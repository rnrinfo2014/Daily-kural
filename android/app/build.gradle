apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
android {
    namespace 'com.nithamorukural.habitapp'
    compileSdk 36
    defaultConfig {
        applicationId 'com.nithamorukural.habitapp'
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName '1.1.1'
    }
    buildFeatures { compose true; buildConfig true }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            ['http.proxyHost','http.proxyPort','https.proxyHost','https.proxyPort','javax.net.ssl.trustStore'].each { key ->
                if (System.getProperty(key)) systemProperty key, System.getProperty(key)
            }
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions { jvmTarget = '21' }
    signingConfigs {
        release {
            if (System.getenv('KURAL_KEYSTORE_PATH')) {
                storeFile file(System.getenv('KURAL_KEYSTORE_PATH'))
                storePassword System.getenv('KURAL_KEYSTORE_PASSWORD')
                keyAlias System.getenv('KURAL_KEY_ALIAS')
                keyPassword System.getenv('KURAL_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('KURAL_KEYSTORE_PATH')) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
dependencies {
    implementation platform('androidx.compose:compose-bom:2025.10.00')
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'androidx.test:core:1.7.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
